name: API regression

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start the Wallet API
        run: |
          uvicorn app.main:app --port 8000 &
          sleep 5

      - name: Run regression suite (quality gate)
        run: pytest -v